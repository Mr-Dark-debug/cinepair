services:
  # 1. FastAPI Signaling Backend (Optimized with Astral uv)
  - type: web
    name: cinepair-signaling
    runtime: python
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:socket_app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ALLOWED_ORIGINS
        value: https://cinepair-frontend.onrender.com
      - key: DB_PATH
        value: /tmp/cinepair.db

  # 2. Vite React Frontend
  - type: web
    name: cinepair-frontend
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SIGNALING_URL
        fromService:
          name: cinepair-signaling
          type: web
          property: host
