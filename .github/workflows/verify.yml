name: Verify CinePair

on:
  push:
    branches: [main, 'Mr-dark-debug/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cinepair_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: cinepair_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cinepair_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt
      - run: npm test
      - run: npm run test:backend
      - name: Verify PostgreSQL accounts
        run: npm run test:backend
        env:
          TEST_DATABASE_URL: postgresql://cinepair_test:local_ci_only@localhost:5432/cinepair_test
      - run: npm run build
