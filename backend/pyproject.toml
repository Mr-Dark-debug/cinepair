[project]
name = "cinepair-backend"
version = "0.1.0"
description = "Real-time WebRTC signaling and room management server for CinePair"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "python-socketio[asyncio]>=5.11.1",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
